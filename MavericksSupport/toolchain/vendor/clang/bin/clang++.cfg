# default flags applied to every C++ link with this in-tree
# clang-22 toolchain. -L/-rpath <CFGDIR>/../lib point at this toolchain's own
# libc++/libc++abi/libunwind (CFGDIR = this file's directory, so the paths stay
# relocatable wherever the toolchain is unpacked); the remaining flags link the C++
# ABI + unwind runtime, the ObjC runtime, and the base system frameworks.
-L<CFGDIR>/../lib
-Wl,-rpath,<CFGDIR>/../lib
-lunwind
-lc++abi
-lobjc
-framework CoreFoundation
-framework Security
-framework CoreServices
