# default flags applied to every C/ObjC link with this in-tree
# clang-22 toolchain. Each link gets the ObjC runtime and the base system frameworks
# the C/ObjC runtime relies on, and -dead_strip_dylibs prunes dylib load commands
# that end up unreferenced after linking.
-Wl,-dead_strip_dylibs
-lobjc
-framework CoreFoundation
-framework Security
-framework CoreServices
