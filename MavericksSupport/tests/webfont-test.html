<!DOCTYPE html>
<html>
<head><title>webfont test</title>
<style>
@font-face {
    font-family: 'RobotoWoff2';
    src: url('https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxK.woff2') format('woff2');
}
@font-face {
    font-family: 'RobotoTTF';
    src: url('https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Regular.ttf') format('truetype');
}
div { font-size: 28px; margin: 12px; }
.w2 { font-family: 'RobotoWoff2', monospace; }
.tt { font-family: 'RobotoTTF', monospace; }
.sys { font-family: Helvetica; }
</style>
</head>
<body>
<div class="sys">System Helvetica: The quick brown fox 0123456789</div>
<div class="w2">WOFF2 Roboto: The quick brown fox 0123456789</div>
<div class="tt">TTF Roboto: The quick brown fox 0123456789</div>
<script>
document.fonts.ready.then(function () { document.title = 'fonts ready'; });
</script>
</body>
</html>
