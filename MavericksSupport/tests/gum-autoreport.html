<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>gUM autoreport</title></head>
<body>
<h2>getUserMedia auto-report</h2>
<button id="b" style="font-size:20px;padding:10px">Start camera</button>
<div id="s">idle</div>
<video id="v" autoplay playsinline muted width="320" style="background:#000"></video>
<script>
function report(msg){
  // Report result back to the HTTP server so it shows in the access log even if the page never
  // visually composites (the VM WindowServer OpenGL context is flaky). Image GET is enough.
  try { new Image().src = '/RESULT/' + encodeURIComponent(msg) + '?t=' + (new Date().getTime()); } catch(e){}
  try { document.getElementById('s').textContent = msg; } catch(e){}
}
report('LOADED mediaDevices=' + (!!navigator.mediaDevices) + ' gUM=' + (!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) + ' enumerate=' + (!!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)));
function tryCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ report('NO-API'); return; }
  report('REQUESTING');
  navigator.mediaDevices.getUserMedia({video:true, audio:false}).then(function(stream){
    var vt = stream.getVideoTracks();
    report('SUCCESS tracks=' + stream.getTracks().length + ' videoLabel=' + (vt[0] ? vt[0].label : 'none') + ' readyState=' + (vt[0] ? vt[0].readyState : '?'));
    try { document.getElementById('v').srcObject = stream; } catch(e){}
    // Re-report after 1.5s to confirm the track stayed live (frames flowing) and didn't end/error.
    setTimeout(function(){ report('AFTER1500 trackState=' + (vt[0] ? vt[0].readyState : '?') + ' muted=' + (vt[0] ? vt[0].muted : '?')); }, 1500);
  }).catch(function(err){ report('FAIL ' + err.name + ' :: ' + err.message); });
}
document.getElementById('b').onclick = tryCamera;
// Auto-attempt on load (no user gesture) AND leave the button for a gesture-driven retry.
window.onload = function(){ setTimeout(tryCamera, 400); };
</script>
</body>
</html>
