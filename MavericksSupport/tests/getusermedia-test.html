<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>getUserMedia test</title></head>
<body style="font-family:-apple-system,Helvetica;margin:24px">
<h2>MediaStream / getUserMedia test</h2>
<div id="status" style="font-size:18px;margin:12px 0">Click "Start camera".</div>
<button id="btn" style="font-size:18px;padding:8px 16px">Start camera</button>
<button id="enum" style="font-size:18px;padding:8px 16px">List devices</button>
<div id="apis" style="margin:12px 0;color:#555"></div>
<video id="v" autoplay playsinline muted style="display:block;margin-top:16px;width:480px;background:#000"></video>
<ul id="devlist"></ul>
<script>
function log(m){document.getElementById('status').textContent=m;}
var apis = [];
apis.push('navigator.mediaDevices: ' + (!!navigator.mediaDevices));
apis.push('getUserMedia: ' + (!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)));
apis.push('legacy getUserMedia: ' + (!!(navigator.getUserMedia || navigator.webkitGetUserMedia)));
apis.push('enumerateDevices: ' + (!!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)));
apis.push('MediaStream: ' + (typeof MediaStream !== 'undefined'));
apis.push('RTCPeerConnection: ' + (typeof RTCPeerConnection !== 'undefined' || typeof webkitRTCPeerConnection !== 'undefined'));
document.getElementById('apis').innerHTML = apis.join('<br>');
document.getElementById('btn').onclick = function(){
  log('Requesting camera...');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ log('getUserMedia NOT available'); return; }
  navigator.mediaDevices.getUserMedia({video:true, audio:false}).then(function(stream){
    log('SUCCESS: camera stream acquired! tracks=' + stream.getTracks().length);
    var v=document.getElementById('v'); v.srcObject=stream;
  }).catch(function(err){ log('FAILED: ' + err.name + ' - ' + err.message); });
};
document.getElementById('enum').onclick = function(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices){ log('enumerateDevices NOT available'); return; }
  navigator.mediaDevices.enumerateDevices().then(function(devs){
    var ul=document.getElementById('devlist'); ul.innerHTML='';
    log('enumerateDevices: ' + devs.length + ' device(s)');
    devs.forEach(function(d){ var li=document.createElement('li'); li.textContent=d.kind+': '+(d.label||'(no label)')+' ['+d.deviceId.substr(0,12)+']'; ul.appendChild(li); });
  }).catch(function(e){ log('enumerateDevices error: '+e); });
};
</script>
</body>
</html>
