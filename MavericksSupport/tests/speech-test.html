<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Speech synthesis test</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:24px;background:#f0f0f0}
button{font-size:20px;padding:12px 24px;margin:8px 8px 8px 0}
#log{font-size:15px;font-weight:bold;color:#0a0;margin-top:14px;white-space:pre-line}
#voices{font-size:13px;color:#333;margin-top:12px;white-space:pre-line;max-height:240px;overflow:auto}
</style></head>
<body>
<h2>Web Speech API — synthesis</h2>
<button id="speak">Speak</button>
<button id="pause">Pause</button>
<button id="resume">Resume</button>
<button id="stop">Stop</button>
<div id="log">log:</div>
<h3>Voices (speechSynthesis.getVoices):</h3>
<div id="voices">(loading…)</div>
<script>
var log=document.getElementById('log'), lines=[];
function L(m){lines.push(m); log.textContent='log:\n'+lines.join('\n');}
if (!('speechSynthesis' in window)) { L('FAIL: window.speechSynthesis is undefined'); }
else { L('OK: window.speechSynthesis exists'); }

function showVoices(){
  var vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  var el=document.getElementById('voices');
  el.textContent = vs.length ? vs.map(function(v){return v.name+' ['+v.lang+']'+(v.default?' (default)':'');}).join('\n') : '(no voices)';
  el.textContent = 'count='+vs.length+'\n'+el.textContent;
}
if (window.speechSynthesis){
  speechSynthesis.onvoiceschanged = showVoices;
  showVoices();
}

document.getElementById('speak').addEventListener('click', function(){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance('Hello from macOS ten point nine. Web speech synthesis is working.');
  u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
  u.onstart = function(){ L('utterance onstart @'+Date.now()%100000); };
  u.onend   = function(){ L('utterance onend @'+Date.now()%100000); };
  u.onerror = function(e){ L('utterance ONERROR: '+(e.error||e)); };
  u.onboundary = function(e){ L('boundary @'+e.charIndex); };
  L('calling speak()…');
  speechSynthesis.speak(u);
});
document.getElementById('pause').addEventListener('click', function(){ speechSynthesis.pause(); L('pause()'); });
document.getElementById('resume').addEventListener('click', function(){ speechSynthesis.resume(); L('resume()'); });
document.getElementById('stop').addEventListener('click', function(){ speechSynthesis.cancel(); L('cancel()'); });
</script>
</body></html>
