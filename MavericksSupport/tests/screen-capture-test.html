<!DOCTYPE html>
<meta charset="utf-8">
<title>screen capture: idle</title>
<style>
  body { font: 13px -apple-system, sans-serif; margin: 16px; }
  button { font-size: 20px; padding: 12px 24px; }
  #banner { font-size: 15px; font-weight: bold; margin: 12px 0; }
  video { width: 480px; border: 1px solid #888; background: #222; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
</style>
<h1>getDisplayMedia screen capture</h1>
<button id="go">Share this screen</button>
<div id="banner">click the button</div>
<video id="preview" autoplay playsinline muted></video>
<pre id="log"></pre>
<script>
const logEl = document.getElementById('log');
const banner = document.getElementById('banner');
function log(m) { logEl.textContent += m + '\n'; }
function verdict(m) { banner.textContent = m; document.title = 'screen capture: ' + m; log(m); }

const canvas = document.createElement('canvas');
let lastHash = null, distinctFrames = 0, samples = 0;

function sample(video) {
  canvas.width = 64; canvas.height = 40;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, 64, 40);
  const d = ctx.getImageData(0, 0, 64, 40).data;
  let h = 0;
  for (let i = 0; i < d.length; i += 4) h = (h * 31 + d[i] + d[i + 1] * 3 + d[i + 2] * 7) | 0;
  samples++;
  if (lastHash !== null && h !== lastHash) distinctFrames++;
  lastHash = h;
  return h;
}

document.getElementById('go').addEventListener('click', async () => {
  verdict('requesting…');
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const track = stream.getVideoTracks()[0];
    log('track label=' + track.label + ' state=' + track.readyState);
    log('settings=' + JSON.stringify(track.getSettings()));
    const v = document.getElementById('preview');
    v.srcObject = stream;
    await v.play().catch(e => log('play rejected: ' + e));
    let ticks = 0;
    const timer = setInterval(() => {
      ticks++;
      const h = sample(v);
      log('t=' + ticks + ' size=' + v.videoWidth + 'x' + v.videoHeight + ' time=' + v.currentTime.toFixed(2) + ' hash=' + h);
      if (ticks === 10) {
        clearInterval(timer);
        if (!v.videoWidth) verdict('FAIL: no video dimensions');
        else if (distinctFrames === 0) verdict('FAIL: frozen — ' + samples + ' samples, 0 changed');
        else verdict('PASS: ' + v.videoWidth + 'x' + v.videoHeight + ', ' + distinctFrames + '/' + samples + ' frames changed');
      }
    }, 500);
  } catch (e) {
    verdict('FAIL: ' + e.name + ': ' + e.message);
  }
});
</script>
