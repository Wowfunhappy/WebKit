<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gamepad API test</title>
<style>
  body { font-family: -apple-system, Helvetica, sans-serif; font-size: 20px; padding: 36px; }
  #status { margin-top: 20px; padding: 22px; font-size: 26px; border-radius: 8px; background:#eee; }
  b { font-family: Menlo, monospace; }
  .row { margin: 6px 0; }
</style>
</head>
<body>
<h1>Gamepad API runtime test</h1>
<div class="row">typeof navigator.getGamepads: <b id="fn">?</b></div>
<div class="row">typeof window.Gamepad: <b id="gp">?</b></div>
<div class="row">typeof window.GamepadEvent: <b id="ev">?</b></div>
<div class="row">'ongamepadconnected' in window: <b id="on">?</b></div>
<div class="row">navigator.getGamepads() returned: <b id="ret">?</b></div>
<div id="status">testing&hellip;</div>
<div id="live" style="margin-top:16px; font-size:18px; color:#333;"></div>
<script>
(function () {
  function set(id, v){ document.getElementById(id).textContent = v; }
  function fin(msg, ok){
    var s = document.getElementById('status');
    s.textContent = msg; s.style.background = ok ? '#b6f2b6' : '#f2b6b6';
    document.title = (ok ? 'PASS' : 'FAIL') + ' - Gamepad';
  }
  set('fn', typeof navigator.getGamepads);
  set('gp', typeof window.Gamepad);
  set('ev', typeof window.GamepadEvent);
  set('on', ('ongamepadconnected' in window));
  try {
    if (typeof navigator.getGamepads !== 'function') {
      set('ret', '(n/a)');
      fin('FAIL: navigator.getGamepads is undefined — Gamepad API hidden', false);
      return;
    }
    var list = navigator.getGamepads();
    set('ret', Object.prototype.toString.call(list) + ' length=' + (list ? list.length : 'null'));
    fin('PASS: Gamepad API is exposed (getGamepads() works). Connect a controller to see live input below.', true);
  } catch (err) {
    set('ret', 'threw');
    fin('EXCEPTION calling getGamepads(): ' + err, false);
  }
  // Live controller feedback if hardware is present.
  window.addEventListener('gamepadconnected', function (e) {
    document.getElementById('live').textContent =
      'gamepadconnected: ' + e.gamepad.id + ' (' + e.gamepad.buttons.length + ' buttons, ' + e.gamepad.axes.length + ' axes)';
  });
})();
</script>
</body>
</html>
