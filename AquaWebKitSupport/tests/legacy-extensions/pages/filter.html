<!doctype html>
<meta charset="utf-8">
<title>filterResponseData and privacy</title>
<!-- response-filter.safariextension rewrites /filter/ responses and sets the privacy settings asked for here.
     Results collect in window.__results. Also load http://localhost:8843/filter/page.html in a tab showing a
     127.0.0.1 page (a filtered navigation to another site), leave /filter/slow.txt mid-load (a cancelled
     filter, which the extension's filterErrors then lists), and leave /filter/held.txt within five seconds of
     loading it, after which loading it again comes from the cache (the server's log has one request for it).
     early.txt's filter ends the body at its start (earlyMs short, earlyCompletions one onCompleted after the
     network's three seconds); parts.png's two image parts end as 3x2.
     results.views has the extension's filters of its own global page's and popover's loads (WebKit 1 views). -->
<a id="ping" href="#pinged" ping="/ping-record">ping</a>
<script>
'use strict';
const ask = message => new Promise(resolve => {
    const id = Math.random();
    addEventListener('message', function listener(event) {
        if (!event.data || event.data.reply !== id)
            return;
        removeEventListener('message', listener);
        resolve(event.data.result);
    });
    postMessage({ toExtension: message, id }, '*');
});
const text = path => fetch(path).then(response => response.text());
const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
const summary = string => string.length > 80 ? `${string.slice(0, 40)}…${string.slice(-60)} (${string.length})` : string;
const log = () => fetch('/log').then(response => response.json());

const pings = async () => (await log()).filter(entry => entry.path === '/ping-record').length;
const pingWith = async value => {
    const setting = await ask({ privacy: ['websites', 'hyperlinkAuditingEnabled'], value });
    const before = await pings();
    document.getElementById('ping').click();
    await sleep(800);
    return { setting, pinged: (await pings()) - before };
};
const preconnects = () => fetch('/preconnects').then(response => response.json());
const preconnectWith = async value => {
    const setting = await ask({ privacy: ['network', 'networkPredictionEnabled'], value });
    const before = await preconnects();
    const link = document.createElement('link');
    link.rel = 'preconnect';
    link.href = `http://127.0.0.1:8845/?${Math.random()}`;
    document.head.appendChild(link);
    await sleep(800);
    return { setting, preconnected: (await preconnects()) - before };
};

(async () => {
    // filter.html?revalidations reports what the extension recorded for cached.txt and revalidated.txt loads,
    // such as main-frame navigations to them, and runs nothing else.
    // filter.html?handlerBehaviorChanged empties the memory caches, so that the next load of a cached response
    // comes from the disk cache.
    if (location.search === '?handlerBehaviorChanged') {
        window.__results = { emptied: await ask({ handlerBehaviorChanged: true }) };
        return;
    }
    if (location.search === '?revalidations') {
        window.__results = { revalidations: await ask({ revalidations: true }) };
        return;
    }
    const results = {};
    results.script = await text('/filter/script.txt');
    results.prefix = await text('/filter/prefix.txt');
    results.plain = await text('/filter/plain/x.txt');
    results.count = summary(await text('/filter/chunked-count.txt'));
    results.suspend = summary(await text('/filter/suspend.txt'));
    results.disconnect = summary(await text('/filter/disconnect.txt'));
    results.passthrough = summary(await text('/filter/passthrough.txt'));
    results.empty = await text('/filter/empty.txt');
    results.cachedFirst = await text('/filter/cached.txt');
    results.cachedSecond = await text('/filter/cached.txt');
    const xhr = new XMLHttpRequest();
    xhr.open('GET', '/filter/sync.txt', false);
    xhr.send();
    results.sync = xhr.responseText;
    const earlyStart = Date.now();
    results.early = await text('/filter/early.txt');
    results.earlyMs = Date.now() - earlyStart;
    results.parts = await new Promise(resolve => {
        const image = new Image();
        image.src = `/filter/parts.png?${Math.random()}`;
        document.body.append(image);
        setTimeout(() => resolve(`${image.naturalWidth}x${image.naturalHeight}`), 3000);
    });
    results.earlyCompletions = (await ask({ earlyCompletions: true })).map(entry => ({ event: entry.event, afterMs: entry.time - earlyStart, error: entry.error }));
    results.invalid = await ask({ invalid: true });
    results.filterErrors = await ask({ filterErrors: true });
    await new Promise(resolve => {
        const frame = document.createElement('iframe');
        frame.src = '/filter/part-headers.txt';
        document.body.append(frame);
        setTimeout(() => {
            frame.remove();
            resolve();
        }, 2000);
    });
    // A 304 revalidation reports the cached response in both onHeadersReceived and onCompleted.
    results.revalidatedFirst = await text('/filter/revalidated.txt');
    results.revalidatedSecond = await text('/filter/revalidated.txt');
    results.cancelFirst = await text('/filter/cached.txt?cancel').catch(error => error.name);
    results.cancelSecond = await text('/filter/cached.txt?cancel').catch(error => error.name);
    results.revalidations = await ask({ revalidations: true });
    results.views = await ask({ viewLoads: true });
    // onCompleted reports the multipart response's own headers, the same for a tab and a WebKit 1 view.
    results.partHeaderCompletions = await ask({ partHeaderCompletions: true });

    results.pingDefault = await pingWith(undefined);
    results.pingOff = await pingWith(false);
    results.pingCleared = await ask({ privacy: ['websites', 'hyperlinkAuditingEnabled'], clear: true });
    results.pingOn = await pingWith(undefined);
    results.preconnectDefault = await preconnectWith(undefined);
    results.preconnectOff = await preconnectWith(false);
    results.preconnectCleared = await ask({ privacy: ['network', 'networkPredictionEnabled'], clear: true });
    window.__results = results;
    document.body.append(JSON.stringify(results));
})();
</script>
