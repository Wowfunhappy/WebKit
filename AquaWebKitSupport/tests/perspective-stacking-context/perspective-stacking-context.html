<!DOCTYPE html>
<meta charset="utf-8">
<title>Dynamic perspective creates a stacking context</title>
<style>
.stage { position:relative; display:inline-block; width:220px; height:200px; perspective:500px; perspective-origin:30% 70%; }
.scene { position:relative; width:200px; height:180px; transform-style:preserve-3d; transform:rotateY(25deg); }
.front, .back { position:absolute; }
.front { left:60px; top:60px; width:80px; height:70px; background:red; transform:translateZ(40px); }
.back { left:20px; top:30px; width:160px; height:130px; background:blue; transform:translateZ(20px); }
</style>
<p>The two scenes should match. The left scene gains perspective dynamically.</p>
<div id="dynamic" class="stage" style="perspective:none"><div class="scene"><div class="front"></div><div class="back"></div></div></div>
<div class="stage"><div class="scene"><div class="front"></div><div class="back"></div></div></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();
requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('dynamic').style.perspective = '500px';
    requestAnimationFrame(() => requestAnimationFrame(() => {
        if (window.testRunner)
            testRunner.notifyDone();
    }));
}));
</script>
