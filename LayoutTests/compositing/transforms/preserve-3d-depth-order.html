<!DOCTYPE html>
<meta charset="utf-8">
<title>Depth sorting in nested 3D rendering contexts</title>
<style>
    .scene {
        position: relative;
        display: inline-block;
        width: 240px;
        height: 180px;
        transform-style: preserve-3d;
    }
    .front {
        position: absolute;
        left: 60px;
        top: 50px;
        width: 120px;
        height: 80px;
        background: rgb(220, 40, 40);
        transform: translateZ(40px);
    }
    .back {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 220px;
        height: 160px;
        background: rgb(40, 90, 220);
        transform: translateZ(20px);
    }
    .negative .front { transform: translateZ(-20px); }
    .negative .back { transform: translateZ(-40px); }
    .nested { transform: translateZ(0); }
    .nested .group { transform-style: preserve-3d; }
    .flat { transform-style: flat; }
</style>
<p>Each 3D scene shows a red rectangle in front of a larger blue rectangle. The flat scene is blue.</p>
<div class="scene"><div class="front"></div><div class="back"></div></div>
<div class="scene"><div class="back"></div><div class="front"></div></div>
<div class="scene negative"><div class="front"></div><div class="back"></div></div>
<div class="scene nested"><div class="group"><div class="front"></div><div class="back"></div></div></div>
<div class="scene flat"><div class="front"></div><div class="back"></div></div>
