<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; }
.background { width: 400px; height: 200px; background: linear-gradient(black 100px, white 100px); }
.panel { position: absolute; top: 50px; width: 100px; height: 100px; overflow: hidden; }
#rounded { border-radius: 20px; }
.filtered { position: absolute; top: -50px; -webkit-filter: blur(8px); transform: translateZ(0); }
</style>
</head>
<body>
<div class="background"></div>
<div class="panel" style="left: 50px"><div class="background filtered" style="left: -50px"></div></div>
<div class="panel" id="rounded" style="left: 250px"><div class="background filtered" style="left: -250px"></div></div>
</body>
</html>
