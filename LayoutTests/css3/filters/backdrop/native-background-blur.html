<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Core Animation's blur and the reference's software blur differ by up to five levels in the blurred area. -->
<meta name="fuzzy" content="maxDifference=0-5; totalPixels=0-10000">
<style>
body { margin: 0; }
.background { width: 200px; height: 200px; background: linear-gradient(black 100px, white 100px); }
.panel { position: absolute; left: 50px; top: 50px; width: 100px; height: 100px; -webkit-backdrop-filter: blur(8px); }
.foreground { position: absolute; left: 20px; top: 20px; width: 10px; height: 10px; background: white; }
</style>
</head>
<body>
<div class="background"></div>
<div class="panel"><div class="foreground"></div></div>
</body>
</html>
