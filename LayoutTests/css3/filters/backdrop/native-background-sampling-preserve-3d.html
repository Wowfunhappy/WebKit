<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; }
.scene { position: absolute; left: 20px; top: 20px; width: 300px; height: 300px; transform-style: preserve-3d; transform: rotateX(0deg); }
.form { position: absolute; left: 50px; top: 50px; width: 200px; height: 200px; transform: translate(10px, 10px); }
.card { position: absolute; left: 0; top: 0; width: 200px; height: 200px; background: blue; transform: translateZ(-50px); }
.front { position: absolute; left: 100px; top: 100px; width: 150px; height: 150px; background: red; transform: translateZ(0); }
.backdrop { position: absolute; left: 0; top: 180px; width: 20px; height: 20px; -webkit-backdrop-filter: blur(0px); }
</style>
</head>
<body>
<div class="scene"><div class="front"></div><div class="form"><div class="card"></div><div class="backdrop"></div></div></div>
</body>
</html>
