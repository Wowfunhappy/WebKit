<!DOCTYPE html> <!-- webkit-test-runner [ AsyncOverflowScrollingEnabled=true AsyncFrameScrollingEnabled=true ] -->
<meta charset="utf-8">
<title>A fixed backdrop filter follows a subframe scrolled on the scrolling thread</title>
<link rel="match" href="native-background-scrolled-iframe-expected.html">
<script src="../../../resources/ui-helper.js"></script>
<style>
body { margin: 0; }
iframe { display: block; width: 200px; height: 100px; border: 0; }
</style>
<iframe id="frame"></iframe>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

frame.srcdoc = `
    <style>
    html, body { margin: 0; height: 500px; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .source { position: absolute; left: 0; width: 200px; height: 50px; }
    .initial { top: 0; height: 100px; background: rgb(255, 0, 0); }
    .scrolled-top { top: 400px; background: rgb(255, 127, 255); }
    .scrolled-bottom { top: 450px; background: rgb(0, 0, 255); }
    .filter { position: fixed; left: 20px; top: 10px; width: 160px; height: 80px; -webkit-backdrop-filter: invert(1); }
    </style>
    <div class="source initial"></div>
    <div class="source scrolled-top"></div>
    <div class="source scrolled-bottom"></div>
    <div class="filter"></div>`;

function frameHasFixedScrollingNode()
{
    if (!window.internals)
        return true;
    return /\(Frame hosting node[\s\S]*\(Frame scrolling node[\s\S]*\(Fixed node/.test(internals.scrollingStateTreeAsText());
}

frame.onload = async () => {
    await UIHelper.ensurePresentationUpdate();
    if (!frameHasFixedScrollingNode())
        document.body.insertAdjacentHTML("beforeend", "<p>FAIL: the frame's fixed element has no scrolling-tree node</p>");
    await UIHelper.mouseWheelScrollAt(100, 50, 0, -1, 0, -180);
    await UIHelper.ensurePresentationUpdate();
    if (window.testRunner)
        testRunner.notifyDone();
};
</script>
