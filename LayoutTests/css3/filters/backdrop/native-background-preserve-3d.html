<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="match" href="native-background-preserve-3d-expected.html">
<style>
body { margin: 0; }
.background { position: absolute; left: 0; top: 0; width: 300px; height: 200px; background: linear-gradient(90deg, #f00 50%, #00f 50%); }
.wrapper { position: absolute; left: 50px; top: 50px; width: 200px; height: 100px; transform-style: preserve-3d; transform: translateZ(0); }
.panel { position: absolute; left: 0; top: 0; width: 200px; height: 100px; -webkit-backdrop-filter: invert(1); }
</style>
</head>
<body>
<div class="background"></div>
<div class="wrapper"><div class="panel"></div></div>
</body>
</html>
