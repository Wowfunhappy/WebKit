<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- A clip-path change alone reaches the backdrop's sampling surfaces. -->
<link rel="match" href="native-background-clip-path-change-expected.html">
<style>
body { margin: 0; }
.background { position: absolute; left: 0; top: 0; width: 300px; height: 200px; background: linear-gradient(90deg, #f00 50%, #00f 50%); }
.panel { position: absolute; left: 50px; top: 50px; width: 200px; height: 100px; -webkit-backdrop-filter: invert(1); -webkit-clip-path: inset(0 100px 0 0); }
.panel.changed { -webkit-clip-path: inset(0 0 0 100px); }
</style>
</head>
<body>
<div class="background"></div>
<div class="panel"></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();
requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelector('.panel').classList.add('changed');
    requestAnimationFrame(() => requestAnimationFrame(() => {
        if (window.testRunner)
            testRunner.notifyDone();
    }));
}));
</script>
</body>
</html>
