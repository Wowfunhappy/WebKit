<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- A reflection's copy of a backdrop samples from the commit that creates it. -->
<link rel="match" href="native-background-reflection-first-commit-expected.html">
<style>
body { margin: 0; }
.background { position: absolute; left: 0; top: 0; width: 240px; height: 240px; background: linear-gradient(90deg, #123456 0 120px, #d06020 120px); }
.panel { position: absolute; left: 40px; top: 20px; width: 160px; height: 80px; -webkit-box-reflect: below 20px; }
.panel.filtered { -webkit-backdrop-filter: invert(1); }
</style>
</head>
<body>
<div class="background"></div>
<div class="panel"></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();
requestAnimationFrame(() => {
    document.querySelector('.panel').classList.add('filtered');
    if (window.testRunner)
        testRunner.notifyDone();
});
</script>
</body>
</html>
