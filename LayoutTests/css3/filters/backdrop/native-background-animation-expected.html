<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The backdrop blur reads only the panel, with its edges duplicated. -->
<style>
body { margin: 0; }
.background { width: 200px; height: 200px; background: linear-gradient(black 100px, white 100px); }
.panel { position: absolute; left: 50px; top: 50px; width: 100px; height: 100px; }
.foreground { position: absolute; left: 20px; top: 20px; width: 10px; height: 10px; background: white; }
.ordinary { position: absolute; left: 250px; top: 50px; width: 100px; height: 100px; background: linear-gradient(black 50px, white 50px); -webkit-filter: blur(6px); transform: translateZ(0); }
.cropped { position: absolute; left: 0; top: 0; width: 100px; height: 100px; background: linear-gradient(black 100px, white 100px) no-repeat; background-size: 600px 200px; filter: url(#cropped-blur); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute"><filter id="cropped-blur" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="8" edgeMode="duplicate"/></filter></svg>
<div class="background"></div>
<div class="panel"><div class="cropped" style="background-position: -50px -50px"></div><div class="foreground"></div></div>
<div class="ordinary"></div>
</body>
</html>
