<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; min-height: 600px; background: white; transform: translateZ(0); }
.panel { position: absolute; left: 30px; top: 30px; width: 140px; height: 100px; border-radius: 15px; overflow: hidden; transform: translateZ(0); }
.fill { position: absolute; width: 100%; height: 100%; background: black; transform: translateZ(0); }
.foreground { position: absolute; left: 30px; top: 30px; width: 20px; height: 20px; background: white; }
.second { left: 230px; transform: translate3d(10px, 10px, 0); }
</style>
</head>
<body>
<div class="panel"><div class="fill"></div><div class="foreground"></div></div>
<div class="panel second"><div class="fill"></div><div class="foreground"></div></div>
</body>
</html>
