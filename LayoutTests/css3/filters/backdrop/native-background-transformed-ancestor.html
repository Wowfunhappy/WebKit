<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Core Animation's blur and the reference's software blur differ by up to five levels in the blurred areas. With two
     background-filter layers in one surface, 10.9 Core Animation draws the pixels within the first one's blur reach
     outside its shape at 254/255 coverage, so one level of what lies behind the page shows through there. -->
<meta name="fuzzy" content="maxDifference=0-5; totalPixels=0-31904">
<style>
body { margin: 0; }
.background { width: 200px; height: 200px; background: linear-gradient(black 100px, white 100px); }
.container { position: absolute; left: 220px; top: 0; transform: translateX(0); }
.wrapper { position: absolute; left: 30px; top: 30px; width: 100px; height: 100px; transform: translate(20px, 20px); }
.panel { position: absolute; left: 0; top: 0; width: 100px; height: 100px; -webkit-backdrop-filter: blur(8px); }
</style>
</head>
<body>
<div class="background"></div>
<div class="wrapper"><div class="panel"></div></div>
<div class="container background"><div class="wrapper"><div class="panel"></div></div></div>
</body>
</html>
