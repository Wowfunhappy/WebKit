<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- A painted mask limits the backdrop from the first commit. -->
<link rel="match" href="native-background-mask-image-expected.html">
<style>
body { margin: 0; }
.background { position: absolute; left: 0; top: 0; width: 300px; height: 200px; background: linear-gradient(90deg, #f00 50%, #00f 50%); }
.panel { position: absolute; left: 50px; top: 50px; width: 200px; height: 100px; -webkit-backdrop-filter: invert(1); -webkit-mask-image: linear-gradient(90deg, black 50%, transparent 50%); }
</style>
</head>
<body>
<div class="background"></div>
<div class="panel"></div>
</body>
</html>
