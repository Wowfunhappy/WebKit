<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; }
.scene { position: absolute; left: 20px; top: 20px; width: 300px; height: 300px; transform: translateZ(0); }
.perspective { perspective: 300px; }
.form { position: absolute; left: 50px; top: 50px; width: 200px; height: 200px; transform: translate(10px, 10px); }
.card { position: absolute; left: 0; top: 0; width: 200px; height: 200px; background: blue; transform: rotateY(50deg); }
.backdrop { position: absolute; left: 0; top: 180px; width: 20px; height: 20px; -webkit-backdrop-filter: blur(0px); }
</style>
</head>
<body>
<div class="scene perspective"><div class="form"><div class="card"></div></div></div>
</body>
</html>
