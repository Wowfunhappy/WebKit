<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; }
.background { position: absolute; left: 0; top: 0; width: 300px; height: 200px; background: linear-gradient(90deg, #f00 50%, #00f 50%); }
.inverted { position: absolute; top: 50px; width: 100px; height: 100px; }
</style>
</head>
<body>
<div class="background"></div>
<div class="inverted" style="left: 50px; background: #0ff"></div>
<div class="inverted" style="left: 150px; background: #ff0"></div>
</body>
</html>
