<!DOCTYPE html> <!-- webkit-test-runner [ CSSUnprefixedBackdropFilterEnabled=true ] -->
<html>
<head>
<meta charset="utf-8">
<meta name="fuzzy" content="maxDifference=0-1; totalPixels=0-4000">
<style>
body { margin: 0; }
.background { width: 600px; height: 200px; background: linear-gradient(black 100px, white 100px); }
.panel { position: absolute; top: 50px; width: 100px; height: 100px; -webkit-backdrop-filter: blur(8px); opacity: 0.5; }
#rounded { border-radius: 20px; }
#animated { opacity: 1; }
</style>
</head>
<body>
<div class="background"></div>
<div class="panel" style="left: 50px"></div>
<div class="panel" id="rounded" style="left: 250px"></div>
<div class="panel" id="animated" style="left: 450px"></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();
(async () => {
    const frame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const panel = document.getElementById('animated');
    await frame();
    const animation = panel.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1000, fill: 'both' });
    await animation.ready;
    await frame();
    animation.pause();
    animation.currentTime = 500;
    await frame();
    if (window.internals && !internals.acceleratedAnimationsForElement(panel).length)
        document.body.style.background = 'red';
    if (window.testRunner)
        testRunner.notifyDone();
})();
</script>
</body>
</html>
