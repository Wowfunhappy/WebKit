<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Reflections added after the backdrop commits must copy its sampling surfaces. -->
<link rel="match" href="native-background-reflection-late-expected.html">
<style>
body { margin: 0; }
.background { position: absolute; left: 0; top: 0; width: 460px; height: 240px; background: linear-gradient(90deg, #123456 0 230px, #d06020 230px); }
.band { position: absolute; left: 0; top: 120px; width: 460px; height: 120px; background: linear-gradient(90deg, #2060c0 0 230px, #e0b020 230px); }
.outer { position: absolute; left: 20px; top: 20px; width: 200px; height: 200px; }
.inner { position: absolute; left: 20px; top: 20px; width: 100px; height: 60px; }
.reflected .outer { -webkit-box-reflect: right 10px; }
.reflected .inner { -webkit-box-reflect: below 10px; }
.panel { position: absolute; left: 0; top: 0; width: 100px; height: 60px; -webkit-backdrop-filter: invert(1); }
</style>
</head>
<body>
<div class="background"></div>
<div class="band"></div>
<div class="outer"><div class="inner"><div class="panel"></div></div></div>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();
const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
(async () => {
    await frame();
    await frame();
    document.body.classList.add('reflected');
    await frame();
    await frame();
    if (window.testRunner)
        testRunner.notifyDone();
})();
</script>
</body>
</html>
