<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; }
.background { position: absolute; left: 0; top: 0; width: 300px; height: 200px; background: repeating-linear-gradient(90deg, #000 0 10px, #fc0 10px 20px), #fc0; }
.panel { position: absolute; left: 50px; top: 50px; width: 160px; height: 80px; overflow: hidden; opacity: 0.5; }
.copy { position: absolute; left: -50px; top: -50px; filter: invert(1); }
</style>
</head>
<body>
<div class="background"></div>
<div class="panel"><div class="background copy"></div></div>
</body>
</html>
